allowBuilds:
  "@parcel/watcher": false
  core-js: false
  esbuild: false

minimumReleaseAgeExclude:
  - vite@8.4.0

overrides:
  # @atproto/lex 0.1.x must use the matching 0.2.1 lex-client; 0.2.4 pulls in
  # lex-schema 0.2.x while the generated lexicons use 0.1.x types.
  "@atproto/lex@0.1.7>@atproto/lex-client": "0.2.1"
